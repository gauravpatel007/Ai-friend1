[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-desktop-friend"
version = "0.1.0"
description = "An intelligent, animated, offline AI companion for Windows desktop"
authors = [
    { name = "Gaurav Patel" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6.0",
    "psutil>=5.9.0",
    "platformdirs>=4.0.0",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-p", "no:cacheprovider", "-p", "no:qt"]
norecursedirs = ["_test_scratch", ".*", "build", "dist", "node_modules", ".venv"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pyright]
include = ["app", "tests"]
extraPaths = ["."]



